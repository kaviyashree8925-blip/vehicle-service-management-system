{% extends "base.html" %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0 border-top border-danger border-4">
      <div class="card-body text-center p-5">
        <i class="bi bi-exclamation-triangle text-danger display-3"></i>
        <h1 class="h4 mt-3">Delete this {{ label|lower }}?</h1>
        <p class="text-muted mb-1"><strong>{{ obj }}</strong></p>
        <p class="text-muted">This action cannot be undone and may remove related records.</p>
        <form method="post" class="d-flex gap-2 justify-content-center">
          {% csrf_token %}
          <a href="{% url back_url %}" class="btn btn-outline-secondary">Cancel</a>
          <button class="btn btn-danger" type="submit"><i class="bi bi-trash me-1"></i>Yes, delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
